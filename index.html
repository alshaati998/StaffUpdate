<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>بوابة تحديث بيانات الموظفين</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f3f6f9;
            color: #1f2937;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .header {
            background: #0b6438;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: auto auto 15px;
            border-radius: 50%;
            background: white;
            color: #0b6438;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header p {
            margin: 10px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .form-area {
            padding: 30px;
        }

        .welcome {
            text-align: center;
            margin-bottom: 28px;
        }

        .welcome h2 {
            margin: 0 0 8px;
            color: #0b6438;
            font-size: 21px;
        }

        .welcome p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.8;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            padding: 0 14px;
            font-size: 16px;
            text-align: right;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #0b6438;
            box-shadow: 0 0 0 3px rgba(11, 100, 56, 0.12);
        }

        button {
            width: 100%;
            height: 50px;
            margin-top: 20px;
            border: none;
            border-radius: 9px;
            background: #0b6438;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #084d2b;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .footer {
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 480px) {
            .page {
                padding: 12px;
            }

            .form-area {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="login-card">

        <div class="header">

            <div class="logo">
                م
            </div>

            <h1>
                بوابة تحديث بيانات الموظفين
            </h1>

            <p>
                نظام تحديث ومراجعة البيانات
            </p>

        </div>

        <div class="form-area">

            <div class="welcome">

                <h2>
                    تسجيل الدخول
                </h2>

                <p>
                    أدخل الرقم الوظيفي للمتابعة
                    وتحديث بياناتك.
                </p>

            </div>

            <form id="loginForm">

                <label for="employeeNo">
                    الرقم الوظيفي
                </label>

                <input
                    type="text"
                    id="employeeNo"
                    inputmode="numeric"
                    autocomplete="off"
                    placeholder="أدخل الرقم الوظيفي">

                <button type="submit">
                    دخول
                </button>

                <div
                    id="message"
                    class="message">
                </div>

            </form>

            <div class="footer">
                جميع الحقوق محفوظة
            </div>

        </div>

    </div>

</div>

<script>

    const loginForm =
        document.getElementById("loginForm");

    const employeeNo =
        document.getElementById("employeeNo");

    const message =
        document.getElementById("message");


    loginForm.addEventListener("submit", function(event) {

        event.preventDefault();

        const number =
            employeeNo.value.trim();

        message.className = "message";
        message.textContent = "";


        if (number === "") {

            message.textContent =
                "فضلاً أدخل الرقم الوظيفي.";

            message.classList.add("error");

            employeeNo.focus();

            return;
        }


        if (!/^[0-9]+$/.test(number)) {

            message.textContent =
                "الرقم الوظيفي يجب أن يحتوي على أرقام فقط.";

            message.classList.add("error");

            employeeNo.focus();

            return;
        }


        message.textContent =
            "تم التحقق من صيغة الرقم الوظيفي بنجاح.";

        message.classList.add("success");

    });

</script>

</body>
</html>
