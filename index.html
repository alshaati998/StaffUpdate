<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>بوابة تحديث بيانات الموظفين</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page">

    <div class="login-card">

        <div class="header">

            <div class="logo">
                م
            </div>

            <h1>
                بوابة تحديث بيانات الموظفين
            </h1>

            <p>
                نظام تحديث ومراجعة البيانات
            </p>

        </div>

        <div class="form-area">

            <div class="welcome">

                <h2>
                    تسجيل الدخول
                </h2>

                <p>
                    أدخل الرقم الوظيفي للمتابعة
                    وتحديث بياناتك.
                </p>

            </div>

            <form id="loginForm">

                <label for="employeeNo">
                    الرقم الوظيفي
                </label>

                <input
                    type="text"
                    id="employeeNo"
                    inputmode="numeric"
                    autocomplete="off"
                    placeholder="أدخل الرقم الوظيفي">

                <button type="submit">
                    دخول
                </button>

                <div
                    id="message"
                    class="message">
                </div>

            </form>

            <div class="footer">
                جميع الحقوق محفوظة
            </div>

        </div>

    </div>

</div>

<script>

    const loginForm =
        document.getElementById("loginForm");

    const employeeNo =
        document.getElementById("employeeNo");

    const message =
        document.getElementById("message");


    loginForm.addEventListener("submit", function(event) {

        event.preventDefault();

        const number =
            employeeNo.value.trim();

        message.className = "message";
        message.textContent = "";


        if (number === "") {

            message.textContent =
                "فضلاً أدخل الرقم الوظيفي.";

            message.classList.add("error");

            employeeNo.focus();

            return;
        }


        if (!/^[0-9]+$/.test(number)) {

            message.textContent =
                "الرقم الوظيفي يجب أن يحتوي على أرقام فقط.";

            message.classList.add("error");

            employeeNo.focus();

            return;
        }


        message.textContent =
            "تم التحقق من صيغة الرقم الوظيفي بنجاح.";

        message.classList.add("success");

    });

</script>

</body>
</html>
